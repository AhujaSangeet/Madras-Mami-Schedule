<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Madras Mami Staff Schedule</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%AA%B7%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f4ec;--card:#fffdf7;--ink:#022d24;--mut:#4f6d63;--line:#ddd8c4;--soft:rgba(2,45,36,.07);--gold:#022d24;--ok:#1f7a4d;--warn:#b36b00;--bad:#b3392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--card);border-bottom:3px solid #c9a227}
header img{height:92px;width:auto;display:block}header div{border-left:1px solid var(--line);padding-left:16px}header h1{margin:0;font:600 21px Georgia,serif;color:var(--ink)}header small{color:var(--gold);letter-spacing:.14em;font-size:11px}
main{max-width:1100px;margin:0 auto;padding:12px 12px 40px}
button,select,input{font:inherit;color:var(--ink)}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--gold);border-color:var(--gold);color:#f6f4ec;font-weight:600}button.ghost{border:0;background:none;color:var(--gold);padding:6px}
select,input{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.wk{display:flex;align-items:center;gap:6px}.wk b{font:600 16px Georgia,serif;min-width:150px;text-align:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mut);padding:8px 14px}.tabs button.on{color:var(--gold);border-color:var(--gold);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.cal table{border-collapse:collapse;width:100%;min-width:820px;table-layout:fixed}
.cal th{padding:8px 4px;border-bottom:1px solid var(--line);font-weight:500;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.cal th b{display:block;font:600 20px Georgia,serif;color:var(--ink);margin-top:2px}
.cal th.today b{background:var(--gold);color:#f6f4ec;width:34px;height:34px;line-height:34px;border-radius:50%;margin:2px auto 0}
.cal th:first-child,.cal td:first-child{width:150px;text-align:left;padding-left:12px}
.cal td{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:5px;vertical-align:top;height:66px}.cal td:first-child{border-left:0}
.cal td.c{cursor:pointer}.cal td.c:hover{background:var(--soft)}.cal td.t{background:rgba(2,45,36,.06)}
.emp b{display:block}.emp span{color:var(--mut);font-size:12px}
.chip{background:var(--soft);border-left:3px solid var(--gold);border-radius:5px;padding:3px 6px;font-size:12px;margin-bottom:3px}.chip.sp{border-color:#8a4b2a}
.plus{color:var(--line);text-align:center;font-size:18px}.hrs{text-align:center;font-weight:600}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-top:12px}.kpi div{background:var(--bg);border-radius:10px;padding:12px}.kpi b{display:block;font:600 22px Georgia,serif}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:8px 0}.row>*{flex:1;min-width:110px}
.lbl{color:var(--mut);font-size:12px;display:block}.note{color:var(--mut);font-size:12px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.strip div{background:var(--card);border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 0;font-size:11px;color:var(--mut)}.strip b{display:block;font-size:16px;color:var(--ink)}.strip .w{background:var(--soft)}.strip .today{border-color:var(--gold)}
.day{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.day:last-of-type{border:0}
.dd{width:46px;text-align:center;color:var(--mut);font-size:11px;text-transform:uppercase}.dd b{display:block;font:600 20px Georgia,serif;color:var(--ink)}.day.today .dd b{color:var(--gold)}
.day .chip{font-size:14px;padding:6px 10px}.off{color:var(--mut);padding-top:10px}
.tot{display:flex;justify-content:space-between;font:600 18px Georgia,serif;padding-top:12px;color:var(--gold)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}.hid{display:none!important}
.sheet{background:var(--card);width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}
.trow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mv{display:none}.dbtn{padding:6px 0;font-size:11px;color:var(--mut)}.dbtn b{display:block;font-size:16px;color:var(--ink)}.dbtn.on{background:var(--gold);border-color:var(--gold)}.dbtn.on,.dbtn.on b{color:#f6f4ec}
.mh{font:600 17px Georgia,serif;margin-bottom:6px}.mr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}.mr:last-child{border:0}.mr .off{padding:0}
@media(max-width:700px){.cal{display:none}.mv{display:block}.wk b{min-width:0;font-size:15px}.day .chip{font-size:17px;padding:10px 12px}.dd b{font-size:24px}.day{padding:16px 0}.tot{font-size:22px}}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.prow{display:grid;grid-template-columns:44px 52px 1fr 70px 56px;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.prow input{width:100%;padding:6px}.prow.hd{color:var(--mut);font-size:11px;text-transform:uppercase}.prow.tt{border:0;font-size:15px;color:var(--gold)}
#banner:not(:empty){position:sticky;top:0;background:var(--bad);color:#fff;padding:10px 12px;border-radius:8px;z-index:20;margin-bottom:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:30;max-width:90%}
.tg{color:#fff;padding:6px 10px;border-radius:6px;font-weight:600;margin:12px 0 2px;font-size:13px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:10px}.seg button{flex:1;border:0;background:none;border-radius:8px;color:var(--mut)}.seg button.on{background:var(--gold);color:#f6f4ec;font-weight:600}
.gc{display:inline-block;margin:6px 10px 0 0;color:var(--gold);font-size:13px;font-weight:600;text-decoration:none}
.ci{font-weight:700;color:var(--ink);width:100%;border:1px solid transparent;background:transparent;padding:7px 3px;text-align:center;font-size:12px;border-radius:6px}.ci:hover{border-color:var(--line)}.ci:focus{outline:2px solid var(--gold);background:var(--card)}.ci.bad{outline:2px solid var(--bad)}
.tgr{color:#fff!important;font-weight:600;text-align:left!important;padding:4px 12px!important;font-size:12px;letter-spacing:.05em;height:auto!important}.cal td.k{padding:2px!important;height:38px!important;vertical-align:middle}.cal table{min-width:980px}
.card,.cal{box-shadow:0 1px 6px rgba(2,45,36,.08)}.cal th{background:var(--card)}.cal td.emp{background:var(--card)}input::placeholder{color:#9bb0a7}.chip{font-weight:700;color:var(--ink)}.mr>div:last-child{text-align:right}
.ci{cursor:pointer}.pre{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.pre button{font-size:12px;padding:6px 10px}.sheet select{width:58%;font-size:16px}
@media(min-width:701px){.modal{align-items:center}.sheet{border-radius:18px}}
.cal td.k{padding:4px!important;height:60px!important;vertical-align:middle}
.ci{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:50px;padding:4px;border:1px solid transparent;border-radius:8px;background:transparent;font-size:13px;font-weight:800;line-height:1.3;text-align:center;color:var(--ink);cursor:pointer}
.ci:hover{background:var(--soft)}.ci span+span{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line);width:100%}.ci .off{font-size:12px;font-weight:600;color:#8aa096}
.chip{background:#e4eee8;border-left-width:5px;font-weight:800;color:var(--ink);letter-spacing:.01em}
.day .chip,.mr .chip{font-size:16px;padding:8px 12px;margin-bottom:4px;display:inline-block}
.fc{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:50px;padding:4px;font-size:13px;font-weight:800;line-height:1.3;text-align:center;color:var(--ink)}
.fc span+span{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line);width:100%}.fc .off{font-size:12px;font-weight:600;color:#8aa096}
.fw table{min-width:900px}.fw td.emp,.fw th:first-child{position:sticky;left:0;z-index:2;background:var(--card);box-shadow:1px 0 0 var(--line)}.fw .me td{background:#e4eee8}.fw .me td.emp{background:#d3e4da}
@media(max-width:700px){.cal.fw{display:block}.fw th:first-child,.fw td:first-child{width:96px!important;padding-left:8px!important}.fw td.emp b{font-size:13px}}
</style></head><body>

<main><div id="banner" class="note"></div><div id="modebar"></div><div class="bar"><div class="wk"><button id="prev">‹</button><b id="wlabel"></b><button id="next">›</button><button class="ghost" id="tod">Today</button></div><div id="tools"></div></div><div id="view"></div></main>
<div id="toast" class="hid"></div><div id="modal" class="modal hid"></div>
<script>

const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const TEAMS=[["Chefs","#8a4b0f"],["Back Kitchen","#8b1e1e"],["KOT","#1f3a7a"],["Dishwasher","#3f7a78"],["FOH","#4a2f7a"]];
const tc=t=>(TEAMS.find(x=>x[0]===t)||[0,"#b8901f"])[1];
const SEED={Chefs:["Ramamoorti","Peter","Jay","Ankit","Arun"],"Back Kitchen":["Arti","Ranjhi","Mythily"],KOT:["Mehak","Aman","Renu"],Dishwasher:["Harry","Parul","Balvir"],FOH:["Harpreet","Harman","Jasmine","Manmeet","Rupali","Khushpreet","Riya","Aarav","Aahan","Rupan"]};
const DEFAULT=[].concat(...Object.entries(SEED).map(([r,l])=>l.map(n=>({id:"s_"+n.toLowerCase(),name:n,role:r,rate:20}))));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.toISOString().slice(0,10);
const mon=d=>{d=new Date(d);d.setUTCHours(12);const k=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-k);return d};
const addD=(d,n)=>{d=new Date(d);d.setUTCDate(d.getUTCDate()+n);return d};
const fmtD=d=>d.toLocaleDateString("en-CA",{month:"short",day:"numeric",timeZone:"UTC"});
const t12=t=>{let[h,m]=t.split(":").map(Number);const a=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(m).padStart(2,"0")+" "+a};
const mins=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const money=n=>"$"+Math.round(n).toLocaleString("en-CA");
const segs=(id,d)=>{const v=(week.shifts||{})[id+"_"+d];return typeof v==="string"&&v?v.split(";"):[]};
const segH=s=>{const p=s.split("-");if(p.length<2)return 0;let d=mins(p[1])-mins(p[0]);if(d<0)d+=1440;return isNaN(d)?0:d/60};
const dayH=(id,d)=>segs(id,d).reduce((a,s)=>a+segH(s),0);
const empHours=id=>DAYS.reduce((a,_,i)=>a+dayH(id,i),0);
const dayTotals=d=>{let h=0,c=0;emps.forEach(e=>{const x=dayH(e.id,d);h+=x;c+=x*(+e.rate||0)});return{h,c}};
const todayIso=iso(new Date());
let user=null,isMgr=false,emps=[],me="",unsubW=null,ws=mon(new Date()),mtab="sched",mday=(new Date().getDay()+6)%7,seeded=false;
const blank=()=>({shifts:{},sales:{},published:false,target:30});
let week=blank();
try{me=localStorage.getItem("mm_me")||""}catch(e){}
const W=()=>db&&db.doc("sched/w_"+iso(ws));
function err(e){$("banner").textContent="Could not save: "+((e&&(e.message||e.code))||e)}
let pending=0;
function toast(m,bad){const t=$("toast");t.textContent=m;t.style.background=bad?"var(--bad)":"var(--ok)";t.classList.remove("hid");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add("hid"),bad?6000:1800)}
const parseWeek=d=>{const w=blank();if(!d)return w;w.published=!!d.published;w.target=+d.target||30;let b={};try{b=JSON.parse(d.blob||"{}")}catch(e){}w.shifts=b.shifts||{};w.sales=b.sales||{};return w};
async function saveWeek(nr){if(!nr)render();if(!db){toast("Saved on this device only",true);return}pending++;
 try{await W().set({published:!!week.published,target:week.target,blob:JSON.stringify({shifts:week.shifts,sales:week.sales})});toast("Saved ✓")}catch(e){toast("Not saved: "+((e&&(e.message||e.code))||e),true)}finally{pending--}}
async function saveRoster(){render();if(db)try{await db.doc("sched/team").set({emps})}catch(e){err(e)}}
function watchWeek(){if(unsubW)unsubW();week=blank();render();if(!db)return;
 unsubW=W().onSnapshot(s=>{if(pending>0)return;const nw=parseWeek(s.exists?s.data():null);if(JSON.stringify(nw)===JSON.stringify(week))return;week=nw;render()},e=>err(e))}
function render(){
 $("wlabel").textContent=fmtD(ws)+" – "+fmtD(addD(ws,6))+", "+addD(ws,6).getUTCFullYear();
 const M=unlocked&&vmode==="mgr";
 $("modebar").innerHTML=`<div class="seg"><button data-vm="staff" class="${M?"":"on"}">Staff</button><button data-vm="mgr" class="${M?"on":""}">Manager portal 🔒</button></div>`;
 $("tools").innerHTML=M?`<span class="pill" style="background:${week.published?"var(--ok)":"var(--mut)"}">${week.published?"Published":"Draft"}</span> <button id="pub" class="${week.published?"":"pri"}">${week.published?"Unpublish":"Publish"}</button> <button data-lock="1" class="ghost">Sign out</button>`:"";
 $("view").innerHTML=M?mgrView():staffView();
 if($("q"))$("q").oninput=e=>{q=e.target.value;$("res").innerHTML=resHtml()};
 if($("who"))$("who").onchange=e=>{me=e.target.value;try{localStorage.setItem("mm_me",me)}catch(_){}render()};
}
const chips=(id,d,c)=>segs(id,d).map((s,i,a)=>{const p=s.split("-");return`<div class="chip${a.length>1?" sp":""}" style="border-color:${c||"var(--gold)"}">${t12(p[0])} to ${t12(p[1])}</div>`}).join("");
const sorted=()=>[...emps].sort((a,b)=>TEAMS.findIndex(t=>t[0]===a.role)-TEAMS.findIndex(t=>t[0]===b.role));
let unlocked=false,vmode="staff",stab="all",sday=(new Date().getDay()+6)%7,q="";
function gcal(d,seg){const[a,b]=seg.split("-"),dt=addD(ws,d),y=x=>iso(x).replace(/-/g,""),c=x=>x.replace(":","")+"00";
 const en=y(mins(b)<=mins(a)?addD(dt,1):dt);
 return"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Madras Mami shift")+"&dates="+y(dt)+"T"+c(a)+"/"+en+"T"+c(b)+"&ctz=America/Toronto&location="+encodeURIComponent("Madras Mami, Brampton")+"&details="+encodeURIComponent("Shift from the Madras Mami schedule. Check with your manager if plans change.")}
const NOTPUB='<div class="card"><b>Schedule not published yet.</b><p class="note">Check back once your manager posts this week.</p></div>';
let fwmode="grid";
function gridHtml(){
 const k=q.trim().toLowerCase(),list=sorted().filter(e=>!k||e.name.toLowerCase().includes(k));
 if(!list.length)return'<div class="card note">No one found with that name.</div>';
 let tr="",last="";list.forEach(e=>{if(e.role!==last){last=e.role;tr+=`<tr><td colspan="9" class="tgr" style="background:${tc(e.role)}">${esc(e.role)}</td></tr>`}
  tr+=`<tr${e.id===me?' class="me"':""}><td class="emp"><b>${esc(e.name)}</b></td>${DAYS.map((_,i)=>`<td class="k${iso(addD(ws,i))===todayIso?" t":""}"><div class="fc">${cellHtml(e.id,i)}</div></td>`).join("")}<td class="hrs">${empHours(e.id)}</td></tr>`});
 return`<div class="cal fw"><table><tr><th></th>${DAYS.map((d,i)=>`<th class="${iso(addD(ws,i))===todayIso?"today":""}">${d.slice(0,3)}<b>${addD(ws,i).getUTCDate()}</b></th>`).join("")}<th style="width:60px">Hrs</th></tr>${tr}</table></div>`}
function resHtml(){return fwmode==="grid"?gridHtml():dayHtml()}
function dayHtml(){
 const k=q.trim().toLowerCase();
 if(k){const l=sorted().filter(e=>e.name.toLowerCase().includes(k));
  return l.map(e=>`<div class="card" style="border-left:5px solid ${tc(e.role)}"><div class="mh">${esc(e.name)} <span class="note">${esc(e.role)} · ${empHours(e.id)} hrs</span></div>${DAYS.map((d,i)=>`<div class="day${iso(addD(ws,i))===todayIso?" today":""}" style="padding:8px 0"><div class="dd">${d.slice(0,3)}<b style="font-size:16px">${addD(ws,i).getUTCDate()}</b></div><div style="flex:1">${segs(e.id,i).length?chips(e.id,i,tc(e.role)):'<div class="off" style="padding-top:6px">OFF</div>'}</div></div>`).join("")}</div>`).join("")||'<div class="card note">No one found with that name.</div>'}
 let n=0,body=TEAMS.map(([t,c])=>{const l=sorted().filter(e=>e.role===t&&segs(e.id,sday).length);n+=l.length;
  return l.length?`<div class="tg" style="background:${c}">${t} · ${l.length}</div>`+l.map(e=>`<div class="mr" style="cursor:default"><b>${esc(e.name)}</b><div>${chips(e.id,sday,c)}</div></div>`).join(""):""}).join("");
 return`<div class="strip">${DAYS.map((d,i)=>`<button data-sd="${i}" class="dbtn${i===sday?" on":""}">${d.slice(0,3)}<b>${addD(ws,i).getUTCDate()}</b></button>`).join("")}</div><div class="card"><div class="mh">${DAYS[sday]}, ${fmtD(addD(ws,sday))} · ${n} working</div>${body||'<p class="note">No shifts scheduled.</p>'}</div>`}
function staffView(){
 if(!emps.length)return'<div class="card">No staff added yet. Ask your manager to set up the roster.</div>';
 const tabs=`<div class="tabs"><button data-st="all" class="${stab==="all"?"on":""}">Full Week</button><button data-st="mine" class="${stab==="mine"?"on":""}">My Schedule</button></div>`;
 if(stab==="all")return tabs+(week.published?`<div class="card"><input id="q" type="search" placeholder="Search your name" value="${esc(q)}" style="width:100%;font-size:16px"><div class="seg" style="margin:10px 0 0"><button data-fw="grid" class="${fwmode==="grid"?"on":""}">Full week</button><button data-fw="day" class="${fwmode==="day"?"on":""}">By day</button></div></div><div id="res">${resHtml()}</div>`:NOTPUB);
 let h=tabs+'<div class="card"><select id="who" style="width:100%"><option value="">Select your name…</option>'+sorted().map(e=>`<option value="${esc(e.id)}"${e.id===me?" selected":""}>${esc(e.name)} (${esc(e.role)})</option>`).join("")+'</select></div>';
 if(!emps.find(x=>x.id===me))return h;
 if(!week.published)return h+'<div class="card"><b>Schedule not published yet.</b><p class="note">Check back once your manager posts this week.</p></div>';
 h+='<div class="strip">'+DAYS.map((d,i)=>`<div class="${segs(me,i).length?"w ":""}${iso(addD(ws,i))===todayIso?"today":""}">${d.slice(0,3)}<b>${dayH(me,i)||"–"}</b></div>`).join("")+'</div><div class="card">';
 h+=DAYS.map((d,i)=>`<div class="day${iso(addD(ws,i))===todayIso?" today":""}"><div class="dd">${d.slice(0,3)}<b>${addD(ws,i).getUTCDate()}</b></div><div style="flex:1">${segs(me,i).length?chips(me,i)+'<span class="note">'+(segs(me,i).length>1?"Split shift · ":"")+dayH(me,i)+' hrs</span>'+segs(me,i).map(x=>`<a class="gc" href="${gcal(i,x)}" target="_blank" rel="noopener">＋ Add to Google Calendar</a>`).join(""):'<div class="off">OFF</div>'}</div></div>`).join("");
 return h+`<div class="tot"><span>Weekly total</span><span>${empHours(me)} hrs</span></div></div>`;
}
function mgrView(){
 let h='<div class="tabs">'+[["sched","Schedule"],["pay","Payroll"],["team","Team"]].map(t=>`<button data-t="${t[0]}" class="${mtab===t[0]?"on":""}">${t[1]}</button>`).join("")+'</div>';
 if(mtab==="team")return h+`<div class="card">${sorted().map(e=>`<div class="trow"><span><span class="dot" style="background:${tc(e.role)}"></span><b>${esc(e.name)}</b> <span class="note">$${+e.rate||0}/h</span></span><span><select data-role="${esc(e.id)}">${TEAMS.map(t=>`<option${t[0]===e.role?" selected":""}>${t[0]}</option>`).join("")}</select> <button class="ghost" data-del="${esc(e.id)}" style="color:var(--bad)">✕</button></span></div>`).join("")}
 <div class="row"><input id="nn" placeholder="Name"><select id="nr">${TEAMS.map(t=>`<option>${t[0]}</option>`).join("")}</select><input id="nw" type="number" placeholder="$/hour" value="20"><button id="add" class="pri">Add employee</button></div></div>`;
 if(mtab==="pay"){let TH=0,TC=0,TS=0;
  const rows=DAYS.map((d,i)=>{const t=dayTotals(i),s=+week.sales[i]||0;TH+=t.h;TC+=t.c;TS+=s;const p=s>0?t.c/s*100:null;
   return`<div class="prow"><b>${d.slice(0,3)}</b><span>${t.h} h</span><input type="number" min="0" data-s="${i}" value="${s||""}" placeholder="Sales $"><span>${money(t.c)}</span><b style="color:${p==null?"var(--mut)":p<=week.target?"var(--ok)":p<=week.target+5?"var(--warn)":"var(--bad)"}">${p==null?"—":p.toFixed(1)+"%"}</b></div>`}).join("");
  const P=TS>0?TC/TS*100:null;
  return h+`<div class="card"><div class="prow hd"><span>Day</span><span>Hours</span><span>Expected sales</span><span>Payroll</span><span>%</span></div>${rows}<div class="prow tt"><b>Week</b><b>${TH} h</b><b>${money(TS)}</b><b>${money(TC)}</b><b>${P==null?"—":P.toFixed(1)+"%"}</b></div>
  <div class="row"><label><span class="lbl">Payroll target %</span><input id="tgt" type="number" value="${week.target}" style="width:100%"></label></div></div>`}
 if(!emps.length)return h+'<div class="card">Add your first employee in the <b>Team</b> tab.</div>';
 let tr="",last="";sorted().forEach(e=>{if(e.role!==last){last=e.role;tr+=`<tr><td colspan="9" class="tgr" style="background:${tc(e.role)}">${esc(e.role)}</td></tr>`}
 tr+=`<tr><td class="emp"><b>${esc(e.name)}</b></td>${DAYS.map((_,i)=>`<td class="k${iso(addD(ws,i))===todayIso?" t":""}"><div class="ci" tabindex="0" data-e="${esc(e.id)}" data-d="${i}">${cellHtml(e.id,i)}</div></td>`).join("")}<td class="hrs" data-hr="${esc(e.id)}">${empHours(e.id)}</td></tr>`});
 tr+=`<tr><td class="emp"><b>Total hours</b></td>${DAYS.map((_,i)=>`<td class="hrs" data-dt="${i}">${dayTotals(i).h}</td>`).join("")}<td class="hrs" id="gt">${DAYS.reduce((a,_,i)=>a+dayTotals(i).h,0)}</td></tr>`;
 h+=`<div class="cal"><table><tr><th></th>${DAYS.map((d,i)=>`<th class="${iso(addD(ws,i))===todayIso?"today":""}">${d.slice(0,3)}<b>${addD(ws,i).getUTCDate()}</b></th>`).join("")}<th style="width:60px">Hrs</th></tr>${tr}</table></div>`;
 h+=`<div class="mv"><div class="strip">${DAYS.map((d,i)=>`<button data-md="${i}" class="dbtn${i===mday?" on":""}">${d.slice(0,3)}<b>${addD(ws,i).getUTCDate()}</b></button>`).join("")}</div><div class="card"><div class="mh">${DAYS[mday]}, ${fmtD(addD(ws,mday))} · ${dayTotals(mday).h} hrs</div>${sorted().map(e=>`<div class="mr c" data-e="${esc(e.id)}" data-d="${mday}" style="border-left:5px solid ${tc(e.role)};padding-left:10px"><div><b>${esc(e.name)}</b><div class="note">${esc(e.role)} · ${empHours(e.id)} hrs this week</div></div><div>${chips(e.id,mday,tc(e.role))||'<span class="off">OFF</span>'}</div></div>`).join("")}</div></div>`;
 return h+`<div class="bar" style="margin-top:10px"><span class="note">Click any cell to pick the start and end time. Tick Split shift for two parts in one day.</span><button class="ghost" id="copy">Copy last week's shifts</button></div>`;
}
function ask(title,o){o=o||{};return new Promise(res=>{const m=$("modal");m.classList.remove("hid");
 m.innerHTML=`<div class="sheet"><b>${esc(title)}</b>${o.msg?`<p class="note">${esc(o.msg)}</p>`:""}${o.input?'<input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Code" style="width:100%;margin:12px 0;font-size:20px;text-align:center;letter-spacing:.3em">':""}<div class="row"><button id="ax">Cancel</button><button id="ay" class="pri">${o.ok||"OK"}</button></div></div>`;
 const done=v=>{m.classList.add("hid");res(v)};if(o.input)setTimeout(()=>$("pin").focus(),50);
 $("ax").onclick=()=>done(null);$("ay").onclick=()=>done(o.input?$("pin").value.trim():true)})}
function tokenDlg(){return new Promise(res=>{const m=$("modal");m.classList.remove("hid");
 m.innerHTML=`<div class="sheet"><b>Manager sign in</b><p class="note">Paste your GitHub access token (one-time setup, see README). It stays on this device only.</p><input id="tk" type="password" placeholder="github_pat_..." autocomplete="off" style="width:100%;margin:8px 0;font-size:16px"><div id="le" class="note" style="color:var(--bad);min-height:18px"></div><div class="row"><button id="lx">Cancel</button><button id="lo" class="pri">Sign in</button></div></div>`;
 $("lx").onclick=()=>{m.classList.add("hid");res(false)};
 $("lo").onclick=async()=>{const t=$("tk").value.trim();if(!t)return;$("le").textContent="Checking…";
  try{const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`,{headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json"}});
   if(!r.ok){$("le").textContent=r.status===404||r.status===401?"Token not accepted for this repository":"GitHub error "+r.status;return}
   TOKEN=t;try{localStorage.setItem("mm_gh",t)}catch(e){}await loadState();notify();m.classList.add("hid");res(true)}catch(e){$("le").textContent="Could not reach GitHub"}}})}
async function openMgr(){
 if(!OWNER||!REPO){toast("Open the app from your GitHub Pages link",true);return}
 if(!TOKEN&&!await tokenDlg())return;
 unlocked=true;vmode="mgr";afterAuth()}
function afterAuth(){isMgr=!!TOKEN;if(!isMgr){unlocked=false;vmode="staff"}else if(emps===DEFAULT&&!seeded){seeded=true;saveRoster()}render()}
function cellHtml(id,d){const l=segs(id,d);return l.length?l.map(x=>{const[a,b]=x.split("-");return`<span>${t12(a)}<br>to ${t12(b)}</span>`}).join(""):'<span class="off">OFF</span>'}
function cellTxt(id,d){return segs(id,d).map(x=>{const[a,b]=x.split("-");return t12(a)+" to "+t12(b)}).join(", ")}
function pt(tok,end){const m=tok.trim().toLowerCase().match(/^(\d{1,2})(?::?(\d{2}))?\s*(a|p)?m?$/);if(!m)return null;let h=+m[1];const mi=+(m[2]||0),ap=m[3];if(h>23||mi>59)return null;
 if(ap){if(h===12)h=ap==="a"?0:12;else if(ap==="p"&&h<12)h+=12}else if(h<12){if(end||h<=8)h+=12}else if(h===12&&end)h=0;
 return String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0")}
function parseShift(v){v=v.trim();if(!v||/^(off|x|-)$/i.test(v))return[];const out=[];
 for(const part of v.split(/[,;\/&]+/)){const p=part.trim().split(/\s*(?:-|–|—|\bto\b)\s*/);if(p.length!==2)return null;const a=pt(p[0],0),b=pt(p[1],1);if(!a||!b||a===b)return null;out.push(a+"-"+b)}return out}
function refreshTotals(){document.querySelectorAll("[data-hr]").forEach(c=>c.textContent=empHours(c.dataset.hr));let g=0;document.querySelectorAll("[data-dt]").forEach(c=>{const h=dayTotals(+c.dataset.dt).h;c.textContent=h;g+=h});const e=$("gt");if(e)e.textContent=g}
function commitCell(inp){const id=inp.dataset.e,d=inp.dataset.d,r=parseShift(inp.value);
 if(r===null){inp.classList.add("bad");toast("Can't read that. Try 4-11 or 9a-2p",true);return}
 inp.classList.remove("bad");const k=id+"_"+d,v=r.join(";");inp.value=r.length?r.map(x=>{const[a,b]=x.split("-");return t12(a)+" to "+t12(b)}).join(", "):"";
 if((week.shifts[k]||"")===v)return;if(v)week.shifts[k]=v;else delete week.shifts[k];refreshTotals();saveWeek(true)}

document.addEventListener("keydown",e=>{const t=e.target;if(!(t.classList&&t.classList.contains("ci")))return;
 const all=[...document.querySelectorAll(".ci")],i=all.indexOf(t);let n=-1;
 if(e.key==="Enter"||e.key===" "){e.preventDefault();edit(t.dataset.e,+t.dataset.d);return}else if(e.key==="ArrowDown")n=i+7;else if(e.key==="ArrowUp")n=i-7;else return;
 e.preventDefault();if(all[n])all[n].focus();else t.blur()});
document.addEventListener("click",async ev=>{
 {const ci=ev.target.closest&&ev.target.closest(".ci");if(ci){edit(ci.dataset.e,+ci.dataset.d);return}}
 const t=(ev.target.closest&&ev.target.closest("button"))||ev.target,ds=t.dataset||{};
 if(ds.lock){dropToken();afterAuth()}
 else if(ds.vm==="mgr"){openMgr()}
 else if(ds.vm){vmode=ds.vm;render()}
 else if(ds.st){stab=ds.st;render()}
 else if(ds.sd){sday=+ds.sd;render()}
 else if(ds.fw){fwmode=ds.fw;render()}
 else if(t.id==="pub"){week.published=!week.published;await saveWeek()}
 else if(ds.t){mtab=ds.t;render()}
 else if(ds.md){mday=+ds.md;render()}
 else if(t.id==="tod"){ws=mon(new Date());watchWeek()}
 else if(t.id==="add"){const n=$("nn").value.trim();if(!n)return;emps.push({id:"e"+Date.now().toString(36),name:n,role:$("nr").value,rate:+$("nw").value||0});await saveRoster()}
 else if(ds.del){const e=emps.find(x=>x.id===ds.del);if(e&&await ask("Remove "+e.name+"?",{ok:"Remove"})){emps=emps.filter(x=>x.id!==e.id);await saveRoster()}}
 else if(t.id==="copy"&&db){const p=await db.doc("sched/w_"+iso(addD(ws,-7))).get();if(!p.exists){toast("No schedule found for last week",true);return}if(await ask("Replace this week's shifts with last week's?",{ok:"Replace"})){week.shifts=parseWeek(p.data()).shifts;await saveWeek()}}
 else{const c=t.closest&&t.closest(".c");if(c&&isMgr)edit(c.dataset.e,+c.dataset.d)}
});
document.addEventListener("change",async ev=>{const t=ev.target,ds=t.dataset||{};
 if(t.classList&&t.classList.contains("ci")){commitCell(t);return}
 if(ds.s!==undefined){week.sales[ds.s]=+t.value||0;await saveWeek()}
 if(t.id==="tgt"){week.target=+t.value||30;await saveWeek()}
 if(ds.role){const e=emps.find(x=>x.id===ds.role);if(e){e.role=t.value;await saveRoster()}}
});
const TIMES=(()=>{const a=[];for(let m=360;m<=1560;m+=15){const q=m%1440;a.push(String(Math.floor(q/60)).padStart(2,"0")+":"+String(q%60).padStart(2,"0"))}return a})();
const opt=v=>(TIMES.includes(v)?TIMES:[...TIMES,v]).map(x=>`<option value="${x}"${x===v?" selected":""}>${t12(x)}</option>`).join("");
const PRE=[["4 PM – 11 PM","16:00","23:00"],["2 PM – 11 PM","14:00","23:00"],["11 AM – 8 PM","11:00","20:00"],["9 AM – 4 PM","09:00","16:00"]];
function edit(id,d){
 const e=emps.find(x=>x.id===id),cur=segs(id,d).map(s=>s.split("-")),a=cur[0]||["16:00","23:00"],b=cur[1]||["17:00","22:00"];
 const m=$("modal");m.classList.remove("hid");
 m.innerHTML=`<div class="sheet"><b>${esc(e.name)} · ${DAYS[d]}, ${fmtD(addD(ws,d))}</b>
 <div class="pre">${PRE.map((p,i)=>`<button data-p="${i}">${p[0]}</button>`).join("")}</div>
 <label>Start <select id="a1">${opt(a[0])}</select></label>
 <label>End <select id="a2">${opt(a[1])}</select></label>
 <label>Split shift <input type="checkbox" id="sp" ${cur.length>1?"checked":""}></label>
 <div id="bl"><label>2nd start <select id="b1">${opt(b[0])}</select></label><label>2nd end <select id="b2">${opt(b[1])}</select></label></div>
 <label>Day off <input type="checkbox" id="off"></label>
 <div class="note" id="sum" style="font-weight:700"></div>
 <div class="row"><button id="x">Cancel</button><button id="ok" class="pri">Save</button></div></div>`;
 const sync=()=>{const off=$("off").checked,sp=$("sp").checked;$("bl").style.display=sp&&!off?"block":"none";["a1","a2","b1","b2","sp"].forEach(i=>$(i).disabled=off);
  const h=off?0:segH($("a1").value+"-"+$("a2").value)+(sp?segH($("b1").value+"-"+$("b2").value):0);$("sum").textContent=off?"Day off":"Total: "+h+" hrs"};
 ["sp","off","a1","a2","b1","b2"].forEach(i=>$(i).onchange=sync);sync();
 m.querySelectorAll("[data-p]").forEach(bt=>bt.onclick=()=>{const p=PRE[+bt.dataset.p];$("off").checked=false;$("a1").innerHTML=opt(p[1]);$("a2").innerHTML=opt(p[2]);sync()});
 $("x").onclick=()=>m.classList.add("hid");
 $("ok").onclick=async()=>{try{const k=id+"_"+d;
  if($("off").checked)delete week.shifts[k];
  else{if($("a1").value===$("a2").value||($("sp").checked&&$("b1").value===$("b2").value)){toast("Start and end can't be the same",true);return}
   let v=$("a1").value+"-"+$("a2").value;if($("sp").checked)v+=";"+$("b1").value+"-"+$("b2").value;week.shifts[k]=v}
  m.classList.add("hid");await saveWeek()}catch(e){err(e)}};
}
$("prev").onclick=()=>{ws=addD(ws,-7);watchWeek()};$("next").onclick=()=>{ws=addD(ws,7);watchWeek()};
render();
let TOKEN="";try{TOKEN=localStorage.getItem("mm_gh")||""}catch(e){}
const GH_OWNER="",GH_REPO="";
const OWNER=GH_OWNER||(location.hostname.endsWith(".github.io")?location.hostname.split(".")[0]:"");
let REPO=GH_REPO||location.pathname.split("/").filter(Boolean)[0]||"";if(/\.html?$/.test(REPO))REPO="";
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/data.json`;
let state={emps:[],weeks:{}},sha,lastTxt="",L=[],tm=null,waiters=[];
const norm=o=>({emps:o.emps||[],weeks:o.weeks||{}});
const b64e=s=>btoa(unescape(encodeURIComponent(s))),b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
const H=()=>({Authorization:"Bearer "+TOKEN,Accept:"application/vnd.github+json"});
function dropToken(){TOKEN="";try{localStorage.removeItem("mm_gh")}catch(e){}}
async function loadState(){let t=null;
 try{if(TOKEN){const r=await fetch(API,{headers:H(),cache:"no-store"});
   if(r.ok){const j=await r.json();sha=j.sha;t=b64d(j.content)}else if(r.status===401)dropToken()}
  if(t===null&&!TOKEN){const r=await fetch("data.json?v="+Date.now(),{cache:"no-store"});if(r.ok)t=await r.text()}
 }catch(e){}
 if(t!==null&&t!==lastTxt){lastTxt=t;try{state=norm(JSON.parse(t))}catch(e){}return true}return false}
const snap=p=>{if(p==="sched/team")return{exists:state.emps.length>0,data:()=>({emps:state.emps})};const w=state.weeks[p.split("w_")[1]];return{exists:!!w,data:()=>w}};
const notify=()=>L.forEach(o=>o.cb(snap(o.p)));
async function ghCommit(){const txt=JSON.stringify(state);let s=sha;
 for(let i=0;i<3;i++){const r=await fetch(API,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},H()),body:JSON.stringify({message:"Update schedule",content:b64e(txt),sha:s})});
  if(r.ok){const j=await r.json();sha=j.content.sha;lastTxt=txt;return}
  if(r.status===409||r.status===422){const g=await fetch(API,{headers:H(),cache:"no-store"});s=g.ok?(await g.json()).sha:undefined;continue}
  throw new Error(r.status===401||r.status===403||r.status===404?"GitHub refused. Check the token has Contents: Read and write for this repository":"GitHub error "+r.status)}
 throw new Error("Could not save, please try again")}
function queueCommit(){return new Promise((res,rej)=>{waiters.push([res,rej]);clearTimeout(tm);tm=setTimeout(async()=>{const w=waiters;waiters=[];try{await ghCommit();w.forEach(x=>x[0]())}catch(e){w.forEach(x=>x[1](e))}},1500)})}
const ready=OWNER&&REPO?loadState():Promise.resolve();
const dbShim={doc:p=>({get:async()=>{await ready;return snap(p)},
 set:d=>{if(p==="sched/team")state.emps=d.emps;else state.weeks[p.split("w_")[1]]=d;return queueCommit()},
 onSnapshot:cb=>{const o={p,cb};L.push(o);ready.then(()=>cb(snap(p)));return()=>{L=L.filter(x=>x!==o)}}})};
let db=null;
(async()=>{
 if(!OWNER||!REPO){$("banner").textContent="Open this page from your GitHub Pages link (https://yourname.github.io/repo/) so it can find its data.";emps=DEFAULT;render();return}
 db=dbShim;
 db.doc("sched/team").onSnapshot(x=>{const d=x.exists?x.data().emps:null;if(d&&d.length)emps=d;else{emps=DEFAULT;if(isMgr&&!seeded){seeded=true;saveRoster()}}render()});
 watchWeek();
 ready.then(afterAuth);
 setInterval(async()=>{if(TOKEN)return;if(await loadState())notify()},60000);
})();
</script></body></html>
